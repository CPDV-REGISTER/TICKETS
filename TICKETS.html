<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Tickets - CPDV</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        
        <!-- Tarjeta del Formulario -->
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0"><i class="fa-solid fa-ticket me-2"></i>Crear Nuevo Ticket</h4>
          </div>
          <div class="card-body p-4">
            <form id="formTicket">
              <div class="mb-3">
                <label class="form-label">Tipo de Ticket</label>
                <select class="form-select" id="tipo" required>
                  <option value="">Seleccione...</option>
                  <option value="Informatica">Informática</option>
                  <option value="Mantencion">Mantención</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Categoría</label>
                <input type="text" class="form-control" id="categoria" placeholder="Ej: Impresoras, Red, Pizarra" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Ubicación / Lugar</label>
                <input type="text" class="form-control" id="lugar" placeholder="Ej: Sala 10, Gimnasio" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Mensaje / Detalle</label>
                <textarea class="form-control" id="mensaje" rows="4" required></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="fa-solid fa-paper-plane me-2"></i>Enviar Ticket
              </button>
            </form>
          </div>
        </div>

        <!-- Tabla de Tickets Guardados -->
        <div class="card shadow-sm border-0">
          <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="fa-solid fa-list me-2"></i>Tickets Registrados</h5>
            <button class="btn btn-sm btn-outline-light" onclick="cargarTickets()"><i class="fa-solid fa-rotate me-1"></i>Actualizar</button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Tipo</th>
                    <th>Lugar</th>
                    <th>Estado</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody id="tablaTickets">
                  <!-- Se llena dinámicamente -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // 1. CONEXIÓN A SUPABASE (Reemplaza con tus llaves)
    const SUPABASE_URL = 'https://cizugwcvrijkiqwvcxmf.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpenVnd2N2cmlqa2lxd3ZjeG1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMjgxNzEsImV4cCI6MjEwNDcwNDE3MX0.QUPJZ10OiN-Oy8zUzJNjj3KW39oiRfzEqTqu-LOuQP0';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. GUARDAR TICKET
    document.getElementById('formTicket').addEventListener('submit', async (e) => {
      e.preventDefault();

      const nuevoTicket = {
        tipo: document.getElementById('tipo').value,
        categoria: document.getElementById('categoria').value,
        lugar: document.getElementById('lugar').value,
        mensaje: document.getElementById('mensaje').value,
        estado: 'activo'
      };

      const { data, error } = await _supabase
        .from('tickets')
        .insert([nuevoTicket]);

      if (error) {
        alert('Error al guardar el ticket: ' + error.message);
      } else {
        alert('¡Ticket creado con éxito!');
        document.getElementById('formTicket').reset();
        cargarTickets();
      }
    });

    // 3. CONSULTAR Y MOSTRAR TICKETS EN LA TABLA
    async function cargarTickets() {
      const { data: tickets, error } = await _supabase
        .from('tickets')
        .select('*')
        .order('id', { ascending: false });

      const tbody = document.getElementById('tablaTickets');
      tbody.innerHTML = '';

      if (error) {
        console.error(error);
        return;
      }

      tickets.forEach(t => {
        const fila = `
          <tr>
            <td>#${t.id}</td>
            <td>${t.tipo} - <small class="text-muted">${t.categoria}</small></td>
            <td>${t.lugar}</td>
            <td>
              <span class="badge ${t.estado === 'activo' ? 'bg-success' : 'bg-secondary'}">
                ${t.estado}
              </span>
            </td>
            <td>
              ${t.estado === 'activo' 
                ? `<button class="btn btn-sm btn-outline-danger" onclick="cerrarTicket(${t.id})">Cerrar</button>` 
                : `<small class="text-muted">Finalizado</small>`}
            </td>
          </tr>
        `;
        tbody.innerHTML += fila;
      });
    }

    // 4. CERRAR TICKET
    async function cerrarTicket(id) {
      const comentario = prompt("Escriba el motivo de cierre:");
      if (!comentario) return;

      const { error } = await _supabase
        .from('tickets')
        .update({ estado: 'cerrado', comentario_cierre: comentario })
        .eq('id', id);

      if (error) {
        alert('Error al cerrar ticket');
      } else {
        cargarTickets();
      }
    }

    // Cargar la lista al abrir la página
    cargarTickets();
  </script>
</body>
</html>
